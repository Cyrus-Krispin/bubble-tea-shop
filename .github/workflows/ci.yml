name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infrastructure: ${{ steps.classify.outputs.infrastructure }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - name: Test change classification
        run: node --test .github/ci/detect-changes.test.mjs
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node .github/ci/detect-changes.mjs

  backend:
    name: Backend verification
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend verification
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Test
        working-directory: frontend
        run: pnpm test
      - name: Check types and OpenAPI drift
        working-directory: frontend
        run: pnpm typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Build Storybook
        working-directory: frontend
        run: pnpm build-storybook

  infrastructure:
    name: Infrastructure verification
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - name: Test local Auth infrastructure
        run: >-
          node --test
          infra/supabase/bootstrap-local-users.test.mjs
          infra/supabase/generate-local-auth-keys.test.mjs
          infra/supabase/kong/kong.test.mjs

  release-candidate:
    name: Container and browser release gate
    needs: [changes, backend, frontend, infrastructure]
    if: >-
      ${{ !cancelled()
          && needs.changes.outputs.release == 'true'
          && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
          && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
          && (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install browser test dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate ephemeral local Auth keys
        run: |
          cp .env.example .env
          node infra/supabase/generate-local-auth-keys.mjs >> .env
      - name: Build and start release stack
        run: docker compose up --detach --build --wait
      - name: Run desktop and mobile release browser gate
        working-directory: frontend
        run: pnpm e2e
      - name: Capture failed stack logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Stop release stack
        if: always()
        run: docker compose down --volumes
