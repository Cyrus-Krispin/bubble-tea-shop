name: bubble-tea-shop

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-supabase-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-supabase-postgres}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?Run the local Auth key generator before starting Compose.}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54322}:5432"
    volumes:
      - ./infra/supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./infra/supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - supabase-postgres:/var/lib/postgresql/data
      - supabase-db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost", "-p", "5432"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  meta:
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-local-supabase-postgres}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Run the local Auth key generator before starting Compose.}

  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${KONG_PORT:-8000}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-local-supabase-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:${FRONTEND_PORT:-4173}
      GOTRUE_URI_ALLOW_LIST: http://localhost:${FRONTEND_PORT:-4173}/*,http://localhost:5173/*
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Run the local Auth key generator before starting Compose.}
      GOTRUE_JWT_KEYS: ${JWT_KEYS:?Run the local Auth key generator before starting Compose.}
      GOTRUE_JWT_ISSUER: http://localhost:${KONG_PORT:-8000}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
    ports:
      - "127.0.0.1:${KONG_PORT:-8000}:8000"
    volumes:
      - ./infra/supabase/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  studio:
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
      kong:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-supabase-postgres}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Run the local Auth key generator before starting Compose.}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: Bubble Tea Shop
      DEFAULT_PROJECT_NAME: Local Development
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:${KONG_PORT:-8000}
      SUPABASE_ANON_KEY: ${ANON_KEY:?Run the local Auth key generator before starting Compose.}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?Run the local Auth key generator before starting Compose.}
      AUTH_JWT_SECRET: ${JWT_SECRET:?Run the local Auth key generator before starting Compose.}
      ENABLED_FEATURES_LOGS_ALL: "false"
    ports:
      - "127.0.0.1:${STUDIO_PORT:-54323}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((response) => { if (!response.ok) throw new Error(response.status) })\"",
        ]
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-supabase-postgres}
      LOCAL_SUPABASE_AUTH_ENABLED: "true"
      LOCAL_SUPABASE_AUTH_ISSUER_URI: http://localhost:${KONG_PORT:-8000}/auth/v1
      LOCAL_SUPABASE_AUTH_JWK_SET_URI: http://kong:8000/auth/v1/.well-known/jwks.json
      LOCAL_SUPABASE_AUTH_AUDIENCE: authenticated
      OPENAPI_DOCS_ENABLED: ${OPENAPI_DOCS_ENABLED:-true}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  local-auth-bootstrap:
    image: node:24.16.0-alpine
    restart: "no"
    depends_on:
      auth:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      APPLICATION_API_URL: http://backend:8080
      SUPABASE_AUTH_URL: http://auth:9999
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Run the local Auth key generator before starting Compose.}
      LOCAL_USER_BOOTSTRAP_PHASE: accounts
      LOCAL_OWNER_SUBJECT_FILE: /bootstrap-state/owner-subject
      LOCAL_BOOTSTRAP_ORGANIZATION_ID: 10000000-0000-0000-0000-000000000001
      LOCAL_CUSTOMER_EMAIL: user@user.com
      LOCAL_CUSTOMER_PASSWORD: User@1234
      LOCAL_MANAGER_EMAIL: manager@manager.com
      LOCAL_MANAGER_PASSWORD: Manager@1234
      LOCAL_OWNER_EMAIL: owner@owner.com
      LOCAL_OWNER_PASSWORD: Owner@1234
    command: ["node", "/bootstrap/bootstrap-local-users.mjs"]
    volumes:
      - ./infra/supabase/bootstrap-local-users.mjs:/bootstrap/bootstrap-local-users.mjs:ro
      - local-user-bootstrap-state:/bootstrap-state

  local-owner-bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      local-auth-bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-supabase-postgres}
      OWNER_BOOTSTRAP_ENABLED: "true"
      OWNER_BOOTSTRAP_ORGANIZATION_ID: 10000000-0000-0000-0000-000000000001
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export OWNER_BOOTSTRAP_AUTH_SUBJECT="$$(tr -d '\r\n' < /bootstrap-state/owner-subject)"
        test -n "$$OWNER_BOOTSTRAP_AUTH_SUBJECT"
        exec java -jar /app/app.jar --spring.main.web-application-type=none
    volumes:
      - local-user-bootstrap-state:/bootstrap-state:ro

  local-access-bootstrap:
    image: node:24.16.0-alpine
    restart: "no"
    depends_on:
      local-owner-bootstrap:
        condition: service_completed_successfully
    environment:
      APPLICATION_API_URL: http://backend:8080
      SUPABASE_AUTH_URL: http://auth:9999
      LOCAL_USER_BOOTSTRAP_PHASE: access
      LOCAL_BOOTSTRAP_ORGANIZATION_ID: 10000000-0000-0000-0000-000000000001
      LOCAL_CUSTOMER_EMAIL: user@user.com
      LOCAL_CUSTOMER_PASSWORD: User@1234
      LOCAL_MANAGER_EMAIL: manager@manager.com
      LOCAL_MANAGER_PASSWORD: Manager@1234
      LOCAL_OWNER_EMAIL: owner@owner.com
      LOCAL_OWNER_PASSWORD: Owner@1234
    command: ["node", "/bootstrap/bootstrap-local-users.mjs"]
    volumes:
      - ./infra/supabase/bootstrap-local-users.mjs:/bootstrap/bootstrap-local-users.mjs:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: http://localhost:${KONG_PORT:-8000}
    environment:
      SUPABASE_CONNECT_SRC: http://localhost:${KONG_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4173}:4173"
    depends_on:
      backend:
        condition: service_healthy
      local-access-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:4173/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  supabase-postgres:
  supabase-db-config:
  local-user-bootstrap-state:
