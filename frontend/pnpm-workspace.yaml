  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
minimumReleaseAgeExclude:
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - vitest@4.1.11
peerDependencyRules:
  allowedVersions:
    "openapi-typescript@7.13.0>typescript": "6"
