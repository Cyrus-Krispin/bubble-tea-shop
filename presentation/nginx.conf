server {
    listen 4177;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
