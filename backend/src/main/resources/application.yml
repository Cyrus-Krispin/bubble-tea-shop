spring:
  application:
    name: bubble-tea-shop
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bubble_tea}
    username: ${DATABASE_USERNAME:bubble_tea}
    password: ${DATABASE_PASSWORD:bubble_tea_dev}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  bootstrap:
    owner:
      enabled: ${OWNER_BOOTSTRAP_ENABLED:false}
      auth-subject: ${OWNER_BOOTSTRAP_AUTH_SUBJECT:}
      organization-id: ${OWNER_BOOTSTRAP_ORGANIZATION_ID:}
  catalog:
    guest-location-slug: ${GUEST_LOCATION_SLUG:orchard-central}
  security:
    supabase:
      enabled: ${LOCAL_SUPABASE_AUTH_ENABLED:false}
      issuer: ${LOCAL_SUPABASE_AUTH_ISSUER_URI:}
      jwk-set-uri: ${LOCAL_SUPABASE_AUTH_JWK_SET_URI:}
      audience: ${LOCAL_SUPABASE_AUTH_AUDIENCE:authenticated}

management:
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
    export:
      otlp:
        enabled: ${OTEL_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:10s}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    correlation: "[%X{request.id:-}] "

springdoc:
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
